<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xchange - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .icon {
            width: 80px;
            height: 80px;
            background-color: #FF3B30;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            color: #888888;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .retry-btn {
            background-color: #FF3B30;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .retry-btn:hover {
            background-color: #e6352b;
        }

        .retry-btn:active {
            background-color: #cc2f26;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">X</div>
        <h1>You're offline</h1>
        <p>Please check your internet connection and try again. Some features may not be available offline.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>

    <script>
        // Listen for online event
        window.addEventListener('online', function () {
            // Auto-retry when connection is restored
            setTimeout(function () {
                window.location.reload();
            }, 1000);
        });

        // Show online status
        function updateOnlineStatus() {
            const isOnline = navigator.onLine;
            const status = document.querySelector('.status');
            if (status) {
                status.textContent = isOnline ? 'Back online!' : 'You are currently offline';
                status.style.color = isOnline ? '#4CAF50' : '#FF3B30';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
    </script>
</body>

</html>
